<!-- Светофор из hero, сведённый к тому, что читается в 16px: корпус и три лампы,
     горит зелёная. Погашенные лампы не серые, а притушенные свои цвета — иначе
     во вкладке иконка выглядит сломанной, а не выключенной. -->
