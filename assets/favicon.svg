  <rect width="64" height="64" rx="14" fill="#111827"/>
  <circle cx="32" cy="17" r="7.5" fill="#ef4444" opacity="0.28"/>
  <circle cx="32" cy="32" r="7.5" fill="#eab308" opacity="0.28"/>
  <circle cx="32" cy="47" r="7.5" fill="#22c55e"/>
</svg>
