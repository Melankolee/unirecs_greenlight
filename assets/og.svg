<!-- Исходник картинки для шаринга. В сеть уходит не он, а assets/og.png — svg в og:image
     не понимает ни один крупный шарер. Пересобрать после правки: node tools/render-images.js

     Шрифты только системные: файл рендерится в headless-браузере, и внешний шрифт там
     не успел бы загрузиться — заголовок молча уехал бы в подстановочный.
     Заголовок повторяет h1 лендинга дословно: превью обязано совпадать с тем, что
     человек увидит, кликнув. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#111827"/>
  <rect x="0" y="0" width="1200" height="6" fill="#22c55e"/>

  <g transform="translate(96,190)">
    <text x="0" y="0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="26" font-weight="700" letter-spacing="3" fill="#22c55e">PRE-SEND CHECK</text>

    <text x="0" y="102" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="72" font-weight="700" fill="#f8fafc">Get a green light</text>
    <text x="0" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="72" font-weight="700" fill="#f8fafc">before you hit send</text>

    <text x="0" y="264" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="30" fill="#9ca3af">Unreplaced placeholders · AI clich&#233;s · platform-rule risks</text>
  </g>

  <g transform="translate(880,160)">
    <rect x="0" y="0" width="200" height="440" rx="46" fill="#171f2f" stroke="#252f42" stroke-width="2"/>
    <circle cx="100" cy="100" r="48" fill="#ef4444" opacity="0.25"/>
    <circle cx="100" cy="220" r="48" fill="#eab308" opacity="0.25"/>
    <circle cx="100" cy="340" r="60" fill="#22c55e" opacity="0.16"/>
    <circle cx="100" cy="340" r="48" fill="#22c55e"/>
  </g>
</svg>
