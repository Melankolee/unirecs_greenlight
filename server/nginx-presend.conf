# Пример конфига nginx: статика лендинга + проксирование /api/lead на lead-api.js.
#
# Ключевое: API живёт на том же домене, что и страница. Тогда apiEndpoint в
# assets/js/config.js остаётся '/api/lead', CORS не нужен, и правок во фронте ноль.
#
# Сертификат — certbot: certbot --nginx -d presend.anytoolai.store
# HTTPS обязателен: с https-страницы запрос на http-эндпоинт браузер заблокирует,
# и форма молча перестанет работать.
#
# Домен — поддомен, поэтому пары «www / голый» здесь нет и склеивать нечего: адрес у
# сайта ровно один, тот же, что в canonical, og:url и sitemap.xml. Появится второй
# (второй домен, www-запись) — он обязан отдавать 301 сюда, а не копию сайта: иначе
# поисковик видит два одинаковых сайта, а клики с рекламы делятся между ними.

server {
    listen 80;
    listen [::]:80;
    server_name presend.anytoolai.store;

    # Всё на HTTPS, кроме проверки сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name presend.anytoolai.store;

    ssl_certificate     /etc/letsencrypt/live/presend.anytoolai.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/presend.anytoolai.store/privkey.pem;

    root /opt/presend;
    index index.html;

    # Скорость в KPI (раздел 6): статика сжимается и кешируется, HTML — нет,
    # иначе правка копирайта не доедет до пользователя.
    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 512;

    # Служебные каталоги репозитория наружу не отдаём.
    #
    # Строго выше кеширующего блока: regex-локации nginx проверяет сверху вниз и
    # останавливается на первом совпадении. Если пустить кеширующий блок вперёд, то
    # server/lead-api.js и tools/rules.js подойдут под \.js$ и уедут наружу с кодом 200 —
    # до запрета дело не дойдёт. Каталог с .txt при этом останется закрытым, поэтому
    # ошибка не видна, пока не запросишь именно .js.
    location ~ ^/(server|tools|examples|\.git)/ {
        return 404;
    }
    location ~ ^/(BUSINESS-LOGIC\.md|README\.md)$ {
        return 404;
    }

    location ~* \.(css|js|webp|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Единственный динамический маршрут на весь лендинг.
    location = /api/lead {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # Без этого заголовка rate limit будет считать всех за 127.0.0.1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
